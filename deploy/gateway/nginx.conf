# 本地 NGINX 网关配置
# 作用: 在 Windows 本地 (:9001) 和 K8s Ingress NodePort (:30000) 之间做反向代理
# 架构: 浏览器 → Docker NGINX (:9001) → host.docker.internal:30000 → K8s Ingress → Service → Pod
# 镜像: nginx:latest (非 OpenResty，历史原因目录名未改)
#
# 部署脚本: deploy/gateway/start.sh / stop.sh
# 完整链路: docs/本地网关部署指南.md

server {
    listen 80;
    server_name _;

    # ── 使用 combined 格式 + 上游信息 ──
    access_log /dev/stdout combined;

    # ── 主代理: 全部流量转发到 K8s Ingress NodePort (ingress-nginx:30000) ──
    location / {
        proxy_pass http://host.docker.internal:30000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;

        # 超时设置
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ── 网关自身健康检查 ──
    location /gateway-health {
        access_log off;
        return 200 "NGINX Gateway OK\n";
    }
}
