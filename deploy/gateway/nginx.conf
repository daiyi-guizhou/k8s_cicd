# K8s Console NGINX Gateway Configuration
# Routes all web traffic from localhost:9001 to K8s Ingress NodePort :30000
#
# Architecture: Browser -> Docker NGINX (:9001) -> host.docker.internal:30000 -> K8s Ingress -> Service -> Pod
# Image: nginx:latest
#
# Deploy scripts: deploy/gateway/start.sh / stop.sh
# Docs: docs/K8s??????.md

# When the browser reaches the gateway via an IP (127.0.0.1 / localhost)
# instead of the FQDN, rewrite the upstream Host to the real ingress host so
# the K8s Ingress still matches the correct route (avoids 404 from the
# ingress default backend). The FQDN itself is passed through unchanged.
map $host $upstream_host {
    default     $host;
    localhost   k8s-cicd.daiyi.local.com;
    127.0.0.1   k8s-cicd.daiyi.local.com;
}

server {
    listen 9001;
    listen 9091;
    server_name k8s-cicd.daiyi.local.com kibana.logging.local grafana.monitoring.local prometheus.monitoring.local alertmanager.monitoring.local _;

    # Combined access log
    access_log /dev/stdout combined;

    # Main proxy ? all traffic forwarded to K8s Ingress NodePort.
    # 使用 --network host 启动容器，故 127.0.0.1 即宿主机回环，
    # docker-desktop 的 NodePort 30000 发布在 127.0.0.1 上，无需 port-forward。
    location / {
        proxy_pass http://127.0.0.1:30000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required by Grafana live features)
        proxy_set_header Upgrade $http_upgrade;

        # Timeouts
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Gateway self health check
    location /gateway-health {
        access_log off;
        return 200 "NGINX Gateway OK\n";
    }
}
