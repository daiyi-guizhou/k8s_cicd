# 07-prd-app.yaml
# 业务演示层 (prd namespace)
# Deployment + Service + Ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prd-app
  namespace: prd
  labels:
    app: prd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prd-app
  template:
    metadata:
      labels:
        app: prd-app
    spec:
      # imagePullSecrets 生产环境使用私有仓库时取消注释:
      # imagePullSecrets:
      #   - name: docker-registry
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: prd-app
  namespace: prd
  labels:
    app: prd-app
spec:
  type: ClusterIP
  selector:
    app: prd-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prd-app
  namespace: prd
  labels:
    app: prd-app
spec:
  ingressClassName: nginx
  rules:
    - host: myapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prd-app
                port:
                  number: 80
