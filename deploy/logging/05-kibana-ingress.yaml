apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: prd
  labels:
    app: kibana
    component: logging
spec:
  ingressClassName: nginx
  rules:
    - host: kibana.logging.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601
