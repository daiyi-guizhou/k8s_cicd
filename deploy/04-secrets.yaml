---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: prd
type: kubernetes.io/dockerconfigjson
data:
  # echo -n '{"auths":{"registry.example.com":{"username":"user","password":"pass","auth":"dXNlcjpwYXNz"}}}' | base64
  .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6InBsYWNlaG9sZGVyIiwicGFzc3dvcmQiOiJwbGFjZWhvbGRlciIsImF1dGgiOiJjR3hqWldsb2IyUmxiZz09In19fQ==
---
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  namespace: prd
type: Opaque
data:
