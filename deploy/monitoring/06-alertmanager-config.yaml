apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: prd
  labels:
    app: alertmanager
    component: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ["alertname", "severity"]
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: "null"
      routes:
        - match:
            severity: critical
          receiver: "null"
          group_wait: 5s
          repeat_interval: 30m

    receivers:
      - name: "null"