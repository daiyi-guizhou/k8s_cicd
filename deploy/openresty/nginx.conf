# OpenResty 配置 — 本地网关 (后续部署到本地)
#
# 架构位置: 浏览器 → 127.0.0.1:80 (OpenResty) → 127.0.0.1:30000 (NodePort) → Controller → prd-app
#
# 安装 OpenResty 后，将此文件放到 /usr/local/openresty/nginx/conf/nginx.conf
# 或者直接使用: openresty -p $PWD -c nginx.conf

worker_processes  1;
error_log  logs/error.log  warn;

events {
    worker_connections  1024;
}

http {
    # ── Lua 共享内存 (用于限流) ──────────────────────
    lua_shared_dict my_limit_req_store  10m;
    lua_shared_dict my_limit_conn_store 10m;
    lua_shared_dict my_jwt_cache        10m;

    # ── 上游: K8s Ingress Controller NodePort ──────
    upstream k8s_ingress {
        server 127.0.0.1:30000;
        keepalive 32;
    }

    # ── 限流配置 ────────────────────────────────────
    # 全局: 每秒 100 请求，突发 200
    limit_req_zone  $binary_remote_addr  zone=global_req:10m  rate=100r/s;
    # 按 Host: 每个域名独立限流
    limit_req_zone  $host  zone=per_host_req:10m  rate=50r/s;
    # 连接数限制: 每个 IP 最大 20 并发连接
    limit_conn_zone $binary_remote_addr  zone=per_ip_conn:10m;

    # ── 日志格式 (JSON, 便于 ELK/Loki) ─────────────
    log_format  json  escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_response_status",'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log  logs/access.log  json;

    # ── 通用设置 ────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 64m;

    # 安全头
    add_header  X-Frame-Options            "SAMEORIGIN"  always;
    add_header  X-Content-Type-Options     "nosniff"     always;
    add_header  X-XSS-Protection           "1; mode=block" always;

    # ── 主 Server (HTTP) ────────────────────────────
    server {
        listen       80;
        server_name  _;

        # 全局连接数限制
        limit_conn  per_ip_conn  20;
        limit_conn_status  429;

        # 全局请求速率限制
        limit_req  zone=global_req  burst=200  nodelay;
        limit_req_status  429;

        # ── Lua 初始化: 每请求执行 ──────────────────
        access_by_lua_block {
            -- 按 Host 限流 (双阶段: 请求速率 + 连接数)
            local limit_req = require "resty.limit.req"
            local limit_conn = require "resty.limit.conn"

            -- 请求速率: 每秒 50，突发 100 (per host)
            local req, req_err = limit_req.new("my_limit_req_store", 50, 100)
            if not req then
                ngx.log(ngx.ERR, "failed to instantiate limit.req: ", req_err)
                return ngx.exit(500)
            end
            local delay, err = req:incoming(ngx.var.host, true)
            if not delay then
                if err == "rejected" then
                    ngx.header["Retry-After"] = 1
                    return ngx.exit(429)
                end
                ngx.log(ngx.ERR, "limit.req error: ", err)
                return ngx.exit(500)
            end

            -- 连接数: 每个 IP 最大 10
            local conn, conn_err = limit_conn.new("my_limit_conn_store", 10, 5)
            if not conn then
                ngx.log(ngx.ERR, "failed to instantiate limit.conn: ", conn_err)
                return ngx.exit(500)
            end
            local _, conn_err2 = conn:incoming(ngx.var.binary_remote_addr, true)
            if conn_err2 == "rejected" then
                return ngx.exit(503)
            end
        end

        # ── JWT 验证 (示例: 仅 /api/ 路径需要) ──────
        # 生产环境取消注释:
        #
        # location /api/ {
        #     access_by_lua_block {
        #         local jwt = require "resty.jwt"
        #         local auth_header = ngx.var.http_authorization
        #         if not auth_header then
        #             ngx.header["WWW-Authenticate"] = 'Bearer realm="myapp"'
        #             return ngx.exit(401)
        #         end
        #         local token = string.match(auth_header, "^Bearer%s+(.+)$")
        #         if not token then
        #             return ngx.exit(401)
        #         end
        #         local jwt_obj = jwt:verify("your-secret-key", token)
        #         if not jwt_obj.verified then
        #             ngx.log(ngx.WARN, "JWT verification failed: ", jwt_obj.reason)
        #             return ngx.exit(403)
        #         end
        #         -- 注入用户信息到 Header 传给上游
        #         ngx.req.set_header("X-User-Id", jwt_obj.payload.sub)
        #     }
        #     proxy_pass http://k8s_ingress;
        # }

        # ── 默认: 透传到 K8s Ingress ────────────────
        location / {
            proxy_pass  http://k8s_ingress;
            proxy_http_version  1.1;
            proxy_set_header    Connection          "";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    X-Forwarded-Host    $host;
            proxy_set_header    X-Forwarded-Port    $server_port;
            proxy_set_header    X-Request-Id        $request_id;
            proxy_set_header    Upgrade             $http_upgrade;   # WebSocket 支持
        }

        # ── 健康检查端点 ────────────────────────────
        location /openresty-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── OpenResty 状态页 (仅本地访问) ────────────
        location /openresty-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
