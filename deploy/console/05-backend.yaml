---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-console-backend
  namespace: prd
  labels:
    app: k8s-console-backend
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-console-backend
  template:
    metadata:
      labels:
        app: k8s-console-backend
        component: backend
    spec:
      serviceAccountName: k8s-console
      containers:
        - name: django
          image: k8s-console-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: k8s-console-config
            - secretRef:
                name: k8s-console-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-console-backend
  namespace: prd
  labels:
    app: k8s-console-backend
spec:
  type: ClusterIP
  selector:
    app: k8s-console-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
