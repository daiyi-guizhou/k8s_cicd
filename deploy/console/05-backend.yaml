---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-console-backend
  namespace: prd
  labels:
    app: k8s-console-backend
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-console-backend
  template:
    metadata:
      labels:
        app: k8s-console-backend
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: k8s-console
      containers:
        # ── Django backend ──
        - name: django
          image: k8s-console-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: k8s-console-config
            - secretRef:
                name: k8s-console-secret
          env:
            - name: SERVICE_NAME
              value: "k8s-console-backend"
            - name: LOG_DIR
              value: "/shared/logs"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: shared-logs
              mountPath: /shared/logs

        # ── filebeat sidecar: tail /shared/logs → Kafka ──
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.15.0
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: shared-logs
              mountPath: /shared/logs
              readOnly: true
            - name: filebeat-config
              mountPath: /usr/share/filebeat/filebeat.yml
              subPath: filebeat.yml

      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: filebeat-config
          configMap:
            name: filebeat-config
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-console-backend
  namespace: prd
  labels:
    app: k8s-console-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: k8s-console-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP