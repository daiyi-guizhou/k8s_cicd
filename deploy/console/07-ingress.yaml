apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-console
  namespace: prd
  labels:
    app: k8s-console
spec:
  ingressClassName: nginx
  rules:
    - host: k8s-cicd.daiyi.local.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: k8s-console-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-console-frontend
                port:
                  number: 80
