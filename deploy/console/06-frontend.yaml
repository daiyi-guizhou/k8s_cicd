---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-console-frontend
  namespace: prd
  labels:
    app: k8s-console-frontend
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-console-frontend
  template:
    metadata:
      labels:
        app: k8s-console-frontend
        component: frontend
    spec:
      containers:
        - name: nginx
          image: k8s-console-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-console-frontend
  namespace: prd
  labels:
    app: k8s-console-frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: k8s-console-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
